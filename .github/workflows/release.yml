name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.92.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $raw = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $raw | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -EQ 'Fast_File_Search').version
          if ($env:RELEASE_TAG -cne "v$version") { throw "Tag must be v$version; got $env:RELEASE_TAG" }
          if (-not (Test-Path "docs/releases/v$version.md")) { throw 'Release notes are missing' }
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install license report generator
        run: cargo install cargo-about --version 0.9.1 --features cli --locked --root target/tools
      - name: Test and package
        run: ./scripts/package.ps1
      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object Extension -In '.zip', '.sha256' | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Fast File Search $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
